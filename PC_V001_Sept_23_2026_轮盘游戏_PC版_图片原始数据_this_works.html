<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>双零轮盘实时分析器 · PC版</title><style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#e8edf7;background:#101626}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1080px;margin:auto}h1{font-size:28px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}.muted{color:#a6b2c8}.panel{background:#1b2437;border:1px solid #34415b;border-radius:14px;padding:20px;margin:18px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input{font-size:24px;width:130px;padding:10px;background:#0d1526;color:white;border:2px solid #6e88af;border-radius:8px}button{padding:12px 16px;font-size:15px;border:0;border-radius:8px;cursor:pointer;background:#2f66cd;color:white}button.secondary{background:#3c4b66}button.danger{background:#a23946}.results{font-size:19px;line-height:2;overflow-wrap:anywhere}.results .line{white-space:nowrap;overflow-x:auto}.chip{display:inline-block;background:#314765;border-radius:7px;margin:3px;padding:5px 9px}.notice{color:#ffcf70}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid .panel{margin:0}@media(max-width:740px){.grid{grid-template-columns:1fr}body{padding:14px}}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #35415a;text-align:left}.money{font-weight:bold;color:#8eefa9}.empty{color:#9eabc1}#status{min-height:24px;color:#ffca84}
</style><style>dialog{border:1px solid #7891ba;border-radius:14px;background:#202b40;color:white;padding:26px;min-width:300px;box-shadow:0 20px 70px #0009}dialog::backdrop{background:#000a}dialog p{font-size:22px;margin:0 0 24px}dialog .row{justify-content:flex-end}</style></head><body><main><h1>双零轮盘实时分析器</h1><div class="muted">PC 版 · 37 代表双零（00）· 最多录入 40 局</div>
<section class="panel"><h2>录入结果</h2><div class="row"><input id="entry" type="text" inputmode="numeric" autocomplete="off" aria-label="输入0到37" placeholder="0–37"><button id="add">确认输入 ↵</button><button id="undo" class="secondary">撤销上一局</button><button id="reset" class="danger">清零 / 新游戏</button></div><p class="muted">输入整数后按 Enter；支持撤销。数据自动保存在本机浏览器。</p><div id="status" role="status"></div></section>
<section class="panel"><h2>游戏结果</h2><div id="results" class="results empty">尚无结果</div></section><div class="grid"><section class="panel"><h2>统计</h2><div id="stats"></div></section><section class="panel"><h2>尾号提醒</h2><div id="tails"></div></section><section class="panel"><h2>数列与倍数</h2><div id="patterns"></div></section></div>
<section class="panel"><h2>三粘连提醒</h2><div id="triples"></div></section><section class="panel"><h2>下注建议</h2><div id="bets"></div></section><section class="panel"><h2>不重复数字 NRNo</h2><strong id="nr"></strong></section>
<p class="muted">下注提示仅执行文件中可明确计算的规则；轮盘结果独立随机，历史记录不能预测下一局。每局建议总额上限 $20。</p></main><dialog id="resetDialog" aria-labelledby="resetQuestion"><p id="resetQuestion">Are you sure?</p><div class="row"><button id="resetYes" class="danger" type="button">Yes</button><button id="resetNo" class="secondary" type="button">No</button></div></dialog><script>
'use strict';
const WHEEL=[0,28,9,26,30,11,7,20,32,17,5,22,34,15,3,24,36,13,1,37,27,10,25,29,12,8,19,31,18,6,21,33,16,4,23,35,14,2];
const SERIES=[[1,3,5,7,9],[2,4,6,8,10],[11,13,15,17],[12,14,16,18],[21,23,25,27],[20,22,24,26,28],[30,32,34,36]];
const TRIPLES=[[2,14,35],[2,20,22]];
const $=id=>document.getElementById(id);const INITIAL_DATA=[18,8,4,18,24,33,3,22,18,17,8,13,18,2,5,2,32,19];let data=[...INITIAL_DATA];try{let saved=JSON.parse(localStorage.getItem('roulette_pc_v2'));if(Array.isArray(saved))data=saved.filter(x=>Number.isInteger(x)&&x>=0&&x<=37).slice(0,40)}catch{}
const fmt=n=>n===37?'00':String(n), html=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;');
function tailGroup(t){return t===0?[0,10,20,30,37]:Array.from({length:t<=6?4:3},(_,i)=>t+10*i)}
function adjacent(n){let i=WHEEL.indexOf(n);return [WHEEL[(i+36)%38],WHEEL[(i+37)%38],WHEEL[(i+1)%38],WHEEL[(i+2)%38]]}
function recentRelated(candidate,recent){return recent.some(n=>n!==candidate&&n>0&&candidate>0&&(n%candidate===0||candidate%n===0))}
function analyze(a){let counts=new Map();a.forEach(n=>counts.set(n,(counts.get(n)||0)+1));let nr=counts.size, hot=[...counts].filter(([,c])=>c>=2).sort((x,y)=>y[1]-x[1]||x[0]-y[0]);let tails=Array.from({length:10},(_,i)=>i===9?0:i+1).map(t=>({t,group:tailGroup(t),missing:tailGroup(t).filter(n=>!counts.has(n))}));let last=a.at(-1),prev15=a.slice(-16,-1), recent5=a.slice(-5);
let series=last===undefined?[]:SERIES.filter(s=>s.includes(last)&&s.some(n=>n!==last&&prev15.includes(n)));
let multiples=last===undefined?[]:a.slice(-6,-1).filter(n=>last>0&&n>0&&n!==last&&(n%last===0||last%n===0)).map(n=>last<n?`${fmt(last)} 是 ${fmt(n)} 的 1/${n/last}`:`${fmt(last)} 是 ${fmt(n)} 的 ${last/n} 倍`);
let triples=TRIPLES.map(t=>({t,missing:t.filter(n=>!a.slice(-15).includes(n))})).filter(x=>x.missing.length===1);
return {counts,nr,hot,tails,series,multiples,triples,recent5}}
function allocate(analysis){let {nr,tails,hot,series,counts,recent5}=analysis;if(nr<19)return {rows:[],reason:'NRNo 达到 19 后显示下注建议。'};let eligible=tails.filter(x=>x.t<=6&&x.missing.length===4);if(!eligible.length)return {rows:[],reason:'目前没有 1–6 尾的四冷号。'};
// Document says select one group; choose ascending tail order for a stable result.
let chosen=eligible[0],cold=chosen.group,nearHot=new Set(hot.map(x=>x[0]));let items=new Map();function add(n,weight,why){let o=items.get(n)||{n,weight:0,why:new Set()};o.weight=Math.max(o.weight,weight);o.why.add(why);items.set(n,o)}
for(let n of cold){let reasons=[],double=false;if(recentRelated(n,recent5)){double=true;reasons.push('最近5局倍数关系')}if(series.some(s=>s.some(v=>counts.has(v))&&s.includes(n))){double=true;reasons.push('等差数列延伸')}if(double)reasons.push('双倍');add(n,double?2:1,reasons.length?reasons.join('、'):'四冷号')}
for(let n of cold)for(let h of adjacent(n))if(nearHot.has(h))add(h,items.get(n).weight,'与冷号相邻的热号');
let covered=[];for(let n of cold)if(recentRelated(n,recent5))for(let h of adjacent(n))if(!items.has(h)&&!covered.includes(h))covered.push(h);
// Priority: core cold numbers, matching hot neighbors, then coverage. Whole dollar stakes.
let rows=[...items.values()].sort((a,b)=>cold.includes(a.n)===cold.includes(b.n)?a.n-b.n:cold.includes(a.n)?-1:1).map(o=>({n:o.n,amount:o.weight,reason:[...o.why].join('、')}));let total=rows.reduce((s,r)=>s+r.amount,0);
for(let n of covered){if(total+2>20)break;rows.push({n,amount:2,reason:'倍数关系覆盖'});total+=2}
let remaining=20-total;for(let r of rows){if(remaining<=0)break;if(cold.includes(r.n)){r.amount++;remaining--}}
return {rows,total:rows.reduce((s,r)=>s+r.amount,0),reason:`选用 ${chosen.t} 尾四冷号；冷号优先，相关热号随后，剩余额度用于覆盖。`}}
function render(){if(!data.length){for(let id of ['results','stats','tails','patterns','triples','bets','nr'])$(id).textContent='';$('entry').disabled=false;$('add').disabled=false;localStorage.setItem('roulette_pc_v2','[]');return}let a=analyze(data);$('results').classList.remove('empty');$('results').innerHTML=Array.from({length:Math.ceil(data.length/31)},(_,i)=>`<div class="line">${data.slice(i*31,i*31+31).map(fmt).join('　')}</div>`).join('');$('nr').textContent=String(a.nr);$('stats').innerHTML=`总游戏次数：${data.length}<br>热号（≥2次）：${a.hot.length?a.hot.map(([n,c])=>`<span class="chip">${fmt(n)}（${c}次）</span>`).join(''):'无'}`;
$('tails').innerHTML=data.length<24?'<span class="empty">第 24 局后显示。</span>':a.tails.map(x=>x.missing.length===x.group.length?`<div class="notice">NO ${x.t} appears（${x.group.map(fmt).join('、')}）</div>`:x.missing.length===1?`<div>${x.t} ENDING WTT ${fmt(x.missing[0])}</div>`:'').filter(Boolean).join('')||'<span class="empty">暂无触发条件</span>';
$('patterns').innerHTML=[...a.series.map(s=>`等差数列：${s.map(fmt).join('、')}`),...a.multiples].map(x=>`<div>${x}</div>`).join('')||'<span class="empty">暂无触发条件</span>';
$('triples').innerHTML=a.triples.map(x=>`<div>三粘连 ${x.t.map(fmt).join('、')}：建议关注 ${fmt(x.missing[0])}（双倍提示）</div>`).join('')||'<span class="empty">暂无触发条件</span>';
let bet=allocate(a);$('bets').innerHTML=bet.rows.length?`<p>${bet.reason}</p><table><thead><tr><th>号码</th><th>金额</th><th>原因</th></tr></thead><tbody>${bet.rows.map(r=>`<tr><td>${fmt(r.n)}</td><td>$${r.amount}</td><td>${html(r.reason)}</td></tr>`).join('')}</tbody></table><p class="money">本次合计 $${bet.total} / $20</p>`:`<span class="empty">${bet.reason}</span>`;$('entry').disabled=data.length>=40;$('add').disabled=data.length>=40;if(data.length>=40)$('status').textContent='已录满 40 局；可撤销或清零。';localStorage.setItem('roulette_pc_v2',JSON.stringify(data))}
function add(){let v=$('entry').value.trim();if(!/^(?:[0-9]|[12][0-9]|3[0-7])$/.test(v)){$('status').textContent='请输入 0 到 37 的整数。';$('entry').focus();return}if(data.length>=40)return;data.push(Number(v));$('entry').value='';$('status').textContent='';render();$('entry').focus()}
$('entry').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});$('add').onclick=add;$('undo').onclick=()=>{if(!data.length)return;data.pop();$('status').textContent='已撤销上一局。';render();$('entry').focus()};$('reset').onclick=()=>$('resetDialog').showModal();$('resetNo').onclick=()=>{$('resetDialog').close();$('entry').focus()};$('resetYes').onclick=()=>{data=[];$('entry').value='';$('status').textContent='';render();$('resetDialog').close();$('entry').focus()};render();$('entry').focus();
</script></body></html>
